<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a7a7a"/>
    </marker>
    <style>
      .layer   { fill:#fbfbfd; stroke:#d0d0d8; stroke-width:1.5; rx:12; }
      .layerlbl{ fill:#8a8a99; font-size:13px; font-weight:700; letter-spacing:2px; }
      .box     { fill:#ffffff; stroke:#ff6f61; stroke-width:1.6; rx:8; }
      .boxdb   { fill:#fff5f3; stroke:#d95e52; stroke-width:1.6; rx:8; }
      .boxext  { fill:#eef4ff; stroke:#5b8def; stroke-width:1.6; rx:8; }
      .title   { fill:#333; font-size:14px; font-weight:600; text-anchor:middle; }
      .sub     { fill:#777; font-size:11px; text-anchor:middle; }
      .edge    { stroke:#7a7a7a; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .h1      { fill:#ff6f61; font-size:22px; font-weight:700; text-anchor:middle; }
    </style>
  </defs>

  <text x="480" y="34" class="h1">JournalJourney — System Architecture</text>

  <!-- Presentation layer -->
  <rect class="layer" x="30" y="60" width="900" height="110" rx="12"/>
  <text x="50" y="82" class="layerlbl">PRESENTATION LAYER</text>
  <rect class="box" x="70" y="95" width="180" height="60" rx="8"/>
  <text x="160" y="120" class="title">Browser (Jinja2 HTML)</text>
  <text x="160" y="138" class="sub">templates + CSS</text>
  <rect class="box" x="300" y="95" width="180" height="60" rx="8"/>
  <text x="390" y="120" class="title">Chart.js</text>
  <text x="390" y="138" class="sub">mood + emotion charts</text>
  <rect class="box" x="530" y="95" width="180" height="60" rx="8"/>
  <text x="620" y="120" class="title">REST clients</text>
  <text x="620" y="138" class="sub">SPA / mobile (JSON)</text>
  <rect class="box" x="750" y="95" width="150" height="60" rx="8"/>
  <text x="825" y="120" class="title">Export</text>
  <text x="825" y="138" class="sub">CSV / PDF files</text>

  <!-- Application layer -->
  <rect class="layer" x="30" y="205" width="900" height="215" rx="12"/>
  <text x="50" y="227" class="layerlbl">APPLICATION LAYER — Flask (create_app factory)</text>

  <rect class="box" x="70" y="245" width="120" height="55" rx="8"/>
  <text x="130" y="268" class="title">auth</text>
  <text x="130" y="285" class="sub">login/session</text>
  <rect class="box" x="205" y="245" width="120" height="55" rx="8"/>
  <text x="265" y="268" class="title">journal</text>
  <text x="265" y="285" class="sub">CRUD + edit</text>
  <rect class="box" x="340" y="245" width="120" height="55" rx="8"/>
  <text x="400" y="268" class="title">dashboard</text>
  <text x="400" y="285" class="sub">analytics</text>
  <rect class="box" x="475" y="245" width="120" height="55" rx="8"/>
  <text x="535" y="268" class="title">insights</text>
  <text x="535" y="285" class="sub">weekly AI</text>
  <rect class="box" x="610" y="245" width="120" height="55" rx="8"/>
  <text x="670" y="268" class="title">export</text>
  <text x="670" y="285" class="sub">csv / pdf</text>
  <rect class="box" x="745" y="245" width="120" height="55" rx="8"/>
  <text x="805" y="268" class="title">api</text>
  <text x="805" y="285" class="sub">JSON /api</text>

  <text x="50" y="335" class="layerlbl">DOMAIN / SERVICE MODULES</text>
  <rect class="box" x="70" y="350" width="240" height="55" rx="8"/>
  <text x="190" y="373" class="title">nlp.py</text>
  <text x="190" y="390" class="sub">tokenise · lemmatise · VADER · NRCLex</text>
  <rect class="box" x="330" y="350" width="240" height="55" rx="8"/>
  <text x="450" y="373" class="title">services.py</text>
  <text x="450" y="390" class="sub">streak · word cloud</text>
  <rect class="box" x="590" y="350" width="275" height="55" rx="8"/>
  <text x="727" y="373" class="title">ai.py</text>
  <text x="727" y="390" class="sub">prompt build · Gemini call</text>

  <!-- Data layer -->
  <rect class="layer" x="30" y="455" width="560" height="120" rx="12"/>
  <text x="50" y="477" class="layerlbl">DATA LAYER</text>
  <rect class="boxdb" x="70" y="490" width="230" height="65" rx="8"/>
  <text x="185" y="515" class="title">SQLAlchemy ORM</text>
  <text x="185" y="533" class="sub">User · DiaryEntry · WeeklyInsight</text>
  <rect class="boxdb" x="330" y="490" width="230" height="65" rx="8"/>
  <text x="445" y="515" class="title">SQLite (site.db)</text>
  <text x="445" y="533" class="sub">Postgres-ready via DATABASE_URL</text>

  <!-- External layer -->
  <rect class="layer" x="620" y="455" width="310" height="120" rx="12"/>
  <text x="640" y="477" class="layerlbl">EXTERNAL SERVICES</text>
  <rect class="boxext" x="660" y="490" width="230" height="65" rx="8"/>
  <text x="775" y="515" class="title">Google Gemini API</text>
  <text x="775" y="533" class="sub">gemini-2.5-flash</text>

  <!-- Cross-cutting -->
  <rect class="layer" x="30" y="610" width="900" height="115" rx="12"/>
  <text x="50" y="632" class="layerlbl">CROSS-CUTTING CONCERNS</text>
  <rect class="box" x="70" y="648" width="180" height="55" rx="8"/>
  <text x="160" y="671" class="title">Security</text>
  <text x="160" y="688" class="sub">Bcrypt · CSRF · sessions</text>
  <rect class="box" x="270" y="648" width="180" height="55" rx="8"/>
  <text x="360" y="671" class="title">Config</text>
  <text x="360" y="688" class="sub">.env · dotenv</text>
  <rect class="box" x="470" y="648" width="180" height="55" rx="8"/>
  <text x="560" y="671" class="title">Error handling</text>
  <text x="560" y="688" class="sub">404 / 500 pages</text>
  <rect class="box" x="670" y="648" width="230" height="55" rx="8"/>
  <text x="785" y="671" class="title">Testing</text>
  <text x="785" y="688" class="sub">pytest — 31 tests</text>

  <!-- Edges -->
  <line class="edge" x1="480" y1="170" x2="480" y2="203"/>
  <line class="edge" x1="450" y1="405" x2="330" y2="488"/>
  <line class="edge" x1="775" y1="405" x2="775" y2="488"/>
  <line class="edge" x1="300" y1="522" x2="330" y2="522"/>
  <line class="edge" x1="590" y1="380" x2="658" y2="490"/>
</svg>
